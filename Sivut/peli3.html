<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Saamen numerot peli</title>
<link rel="stylesheet" href="../tyylit/pelisivu.css">
</head>

<body>

<main>
    <div class="game-container">

        
        <aside class="game-sidebar">
            <h3>Ohjeet</h3>
            <p>Valitse oikea vastaus. Saat pisteen jokaisesta oikeasta vastauksesta.</p>
        </aside>

        
        <section class="game-area">

            <h2 class="game-question" id="question">Kysymys tulee tähän</h2>

            
            <div class="progress-wrapper">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            
            <div class="game-answers" id="answers"></div>

            
            <button class="game-next" id="nextBtn" disabled>Seuraava</button>

            
            <button class="game-restart" id="restartBtn" style="display:none;">Aloita alusta</button>

        </section>

        
        <aside class="game-score">
            <h3>Pisteet</h3>
            <p><span id="score">0</span></p>
        </aside>

    </div>
</main>


<audio id="sound-oikea" src="../äänet/oikea.mp3"></audio>
<audio id="sound-väärä" src="../äänet/väärä.mp3"></audio>

<script src="../js/coodi.js"></script>
</body>
</html>
